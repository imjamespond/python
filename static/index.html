<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>图片上传</title>
  </head>
  <body>
    <h2>上传图片</h2>
    <select id="topN" >
      <option value="">请选择TopN</option>
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <input type="file" id="fileInput" accept="image/*" />
    <br />
    <input type="text" id="searchName" />
    <button onclick="search()">搜索</button>

    <pre>
        <code id="result"></code>
    </pre>

    <script>
      async function search() {
        const file = document.getElementById("fileInput").files[0];

        const form = new FormData();
        form.append("image", file);
        const topN = document.getElementById("topN").value;
        if (topN)
          form.append("topN", topN);
        const searchName = document.getElementById("searchName").value
        if (searchName)
          form.append("searchName", searchName)

        if (!searchName&&!file) return alert("请先选择图片");

        const res = await fetch("/upload", {
          method: "POST",
          body: form,
        });
        const data = await res.json();
        if(!data) return
        const results = data.results;
        if (results.distances){
          const distances = results.distances[0].map((dist,i) => (dist.toFixed(3) + ": " + results.metadatas[0][i]['name']));
          document.getElementById("result").textContent = JSON.stringify(distances, null, 2 ) || data.error;
        } else{
          document.getElementById("result").textContent = results.metadatas?.map(item=>item.name).join("\n") || data.error;
        }

      }
    </script>
  </body>
</html>
