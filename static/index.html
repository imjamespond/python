<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>图片上传</title>
  </head>
  <body>
    <h2>上传图片</h2>
    <select id="topN" >
      <option value="">请选择TopN</option>
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <input type="file" id="fileInput" accept="image/*" />
    <br />
    <button onclick="upload()">上传</button>
    <pre>
        <code id="result"></code>
    </pre>

    <script>
      async function upload() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return alert("请先选择图片");

        const form = new FormData();
        form.append("image", file);
        const topN = document.getElementById("topN").value;
        if (topN)
          form.append("topN", topN);

        const res = await fetch("/upload", {
          method: "POST",
          body: form,
        });
        const data = await res.json();
        if(!data) return
        const results = data.results;
        const distances = results.distances[0].map((dist,i) => (dist.toFixed(3) + ": " + results.metadatas[0][i]['name']));
        document.getElementById("result").textContent = JSON.stringify(distances, null, 2 ) || data.error;
      }
    </script>
  </body>
</html>
